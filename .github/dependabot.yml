# Workflow actions are pinned to commit SHAs with a `# vX.Y.Z` comment (tests/test_docs.py checks it);
# Dependabot bumps the SHA and the comment together. The cooldown skips versions younger than a week,
# so a hijacked release has time to be noticed and pulled before it is proposed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
