# Every PR and every push to main: lint + unit tests, an end-to-end build of the fictional demo with
# size budgets, then browser tests of that build on iPhone WebKit (two sizes) and desktop Chromium.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install ffmpeg (not on the runner image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -m "not slow"

  demo:
    name: Build the demo story
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VANTAGE_FAST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install ffmpeg (not on the runner image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run vantage doctor
      - name: Synthesize footage, process, build, film, package
        run: uv run vantage demo --fast
      - name: Every deliverable exists and matches SHA256SUMS
        working-directory: dist/demo-lakeside
        run: |
          for f in site/index.html site/sw.js site/manifest.webmanifest site/share.jpg \
                   demo-lakeside.html demo-lakeside-lite.html demo-lakeside-offline.zip \
                   film/demo-lakeside-16x9.mp4 film/demo-lakeside-9x16.mp4 \
                   HOW-TO-VIEW.txt build.json SHA256SUMS; do
            test -s "$f" || { echo "::error::missing dist/demo-lakeside/$f"; exit 1; }
          done
          sha256sum --check --strict SHA256SUMS
      - name: Size budgets
        run: uv run python scripts/budgets.py dist/demo-lakeside
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-lakeside
          path: dist/demo-lakeside
          retention-days: 7
          if-no-files-found: error

  web:
    name: Browser tests (iPhone WebKit, desktop Chromium)
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `vantage preview` serves the build (byte ranges for Safari video)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-lakeside
          path: dist/demo-lakeside
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run test:web:ci
      - name: Upload the report (traces, failure screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web-tests/.results/report
            web-tests/.results/test-results
          include-hidden-files: true
          retention-days: 7
      - name: Upload the chapter screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: web-tests/.results/test-results/shots
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
