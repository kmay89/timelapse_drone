# A GitHub Release with every offline deliverable of one story: the offline zip, both single files,
# the films, HOW-TO-VIEW.txt, build.json and SHA256SUMS. Built with the release gates on
# (`--release`: no draft, every {fact:…} known and approved).
#
#   tag v1.2.0                      engine release; ships the demo story as its sample
#   tag <slug>@<edition>            e.g. demo-lakeside@2026-10, a story edition of projects/<slug>
#   workflow_dispatch               any project in this repository, under a tag you name
#
# Two jobs, so no build code or third-party action ever runs beside a token that can push: `build`
# runs with contents: read and uploads the deliverables; `publish` holds contents: write, checks out
# nothing and runs only GitHub's own download action and `gh`. Actions are pinned to commit SHAs
# (Dependabot bumps them) and checkout does not persist its token.
#
# Client projects live in a private repository; give it its own copy of this workflow (docs/PROJECTS.md).
name: Release

on:
  push:
    tags: ["v*", "*@*"]
  workflow_dispatch:
    inputs:
      project:
        description: Project slug (under projects/) or path
        default: demo-lakeside
        required: true
      tag:
        description: Tag to create or update, e.g. demo-lakeside@2026-10
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      slug: ${{ steps.what.outputs.slug }}
      tag: ${{ steps.what.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Install ffmpeg (not on the runner image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - name: Resolve project and tag
        id: what
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then project="$INPUT_PROJECT"; tag="$INPUT_TAG"
          elif [[ "$REF_NAME" == *@* ]]; then project="${REF_NAME%%@*}"; tag="$REF_NAME"
          else project=demo-lakeside; tag="$REF_NAME"; fi
          slug=$(PROJECT="$project" uv run python -c \
            "import os; from vantage.config import load_project; from vantage.paths import find_project; print(load_project(find_project(os.environ['PROJECT'])).slug)")
          { echo "project=$project"; echo "slug=$slug"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
      - name: Synthesize the demo footage
        if: steps.what.outputs.slug == 'demo-lakeside'
        run: uv run python -m vantage.demo.synth projects/demo-lakeside/footage
      - name: Build with the release gates
        env:
          PROJECT: ${{ steps.what.outputs.project }}
        run: uv run vantage all "$PROJECT" --release
      - name: Budgets and checksums
        env:
          SLUG: ${{ steps.what.outputs.slug }}
        run: |
          uv run python scripts/budgets.py "dist/$SLUG"
          (cd "dist/$SLUG" && sha256sum --check --strict SHA256SUMS)
      - name: Stage the files SHA256SUMS lists
        env:
          SLUG: ${{ steps.what.outputs.slug }}
        run: |
          mkdir release
          cd "dist/$SLUG"
          while read -r _ f; do cp --parents -- "$f" "$GITHUB_WORKSPACE/release/"; done < SHA256SUMS
          cp SHA256SUMS "$GITHUB_WORKSPACE/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create / upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Verify the checksums and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLUG: ${{ needs.build.outputs.slug }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          sha256sum --check --strict SHA256SUMS
          assets=("$SLUG-offline.zip" "$SLUG.html" "$SLUG-lite.html" film/*.mp4
                  HOW-TO-VIEW.txt build.json SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            title=$(jq -r .title build.json)
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "$title ($TAG)" --notes-file HOW-TO-VIEW.txt
          fi
