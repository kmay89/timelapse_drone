# Story for the fictional demo. File names below are fixed by vantage.demo.synth (dates and take-off
# times are part of its flight plan). Hotspot x/y, focus and portrait_focus are normalized to the
# aligned masters: the generator's site plan, projected through the exact camera of the 2026-09-20
# reference still, then into the common crop the pipeline keeps (overview: x 0.139, y 0.102,
# w/h 0.774 of the reference; shoreline: x 0.088, y 0.125, w/h 0.820). tests/test_synth.py checks both.

