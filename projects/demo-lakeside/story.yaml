  - type: credits
    id: credits
    title: About this story
    body: >-
      A demonstration of Vantage. The site, the organizations, the people quoted and every figure are
      fictional; the drone footage was generated by a computer, not flown.
    sources:
      - label: "Imagery: procedural drone footage from vantage.demo.synth (seed 7)"
      - label: "Site plan, figures and quotations: invented for this demo"
    notes:
      - All imagery is simulated. Places, organizations and people are fictional.
      - Logos are original artwork made for this demo and represent no real organization.
      - Aerial frames are aligned to the 2026-09-20 flight and color-matched halfway, so the seasons still show.
