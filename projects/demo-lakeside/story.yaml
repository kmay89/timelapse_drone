chapters:
  - type: hero
    id: opening
    kicker: Lakeside · 2025–2026
    title: Where the Wave Pool Was
    body: >-
      Twelve flights, one patch of sky, and eighteen months in which an abandoned waterpark was
      handed back to the lake.
    vantage: overview
    capture: latest
    video: { source: "2026-09-20/DJI_0001.MP4", t: 0 }
    clip_s: 3

  - type: text
    id: the-fence
    kicker: The site
    title: Eighteen summers behind a fence
    surface: paper
    body: |
      The waterpark opened in 1988 on the south shore, a wave pool fanned toward the water so that
      swimmers could see the lake from the deep end. It closed after the {fact:last-season} season and
      never reopened. By the spring of 2025 the slide tubes had faded to pastel, cottonwoods were
      rooting in the walkways, and the pool held a single green puddle where the wave machines used to
      be.

      The plan that replaced it is modest on paper: keep the two gatehouses, remove almost everything
      else, and give the shoreline back. A beach where the pool was. A boardwalk in place of the dock.
      A meadow on the half of the parking lot nobody had needed in years.
    pull_quote: We used to hear it from the porch every August. Then for eighteen years we heard nothing at all.
    attribution: A neighbor on the north shore, at the first public meeting

  - type: scrub
    id: twelve-flights
    kicker: Twelve flights
    title: Eighteen months from the same patch of sky
    body: Scroll to fly the site forward in time. Every frame is aligned to the last flight.
    vantage: overview
    from: earliest
    to: latest
    hold: 0.55
    steps:
      - capture: "2025-04-12"
        text: >-
          **April 2025.** Weeds split the old lot. The wave pool is dry except for its deep end, and four
          slide tubes still coil off a single concrete tower.
      - capture: "2025-07-18"
        text: >-
          **July.** In ten weeks the slides, the lazy river and two buildings are gone. Concrete is sorted
          into piles to be crushed on site; it will go back under the new paths.
        focus: [0.62, 0.54, 1.6]
      - capture: "2025-10-24"
        text: >-
          **October.** Graded from the curb to the reeds. The basin is backfilled, the west half of the lot
          is stripped to earth, and orange survey paint marks where the promenades will run.
      - capture: "2026-01-31"
        text: >-
          **January.** Under snow the plan is legible for the first time: the curving promenades plowed
          clear, the round plaza between the gatehouses, and a freshly striped lot.
        focus: [0.44, 0.58, 1.5]
      - capture: "2026-05-09"
        text: >-
          **May.** Sod goes down in strips from west to east. Sand fills the old fan of the wave pool,
          and the first of {fact:new-trees} go into the ground along the paths.
      - capture: "2026-09-20"
        text: >-
          **September.** The deep end is now the shallow end of a beach.
        focus: [0.44, 0.45, 1.8]
