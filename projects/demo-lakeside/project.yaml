# Vantage demo project: a fictional lakeside site, filmed by a simulated drone.
# The footage is synthesized on demand (it is never committed):
#   uv run vantage demo            # full quality, ~2-3 min to synthesize
#   uv run vantage demo --fast     # CI-sized
slug: demo-lakeside
title: Where the Wave Pool Was
subtitle: Twelve flights over eighteen months, as an abandoned waterpark was handed back to the lake.
kicker: Lakeside · 2025–2026
dek: >-
  For eighteen summers the old waterpark on the south shore sat behind a chain-link fence, its wave
  pool going green at the deep end. Then the excavators came. Every six or seven weeks a drone
  returned to the same patch of sky to watch the shoreline come back: a public beach where the deep
  end was, a boardwalk where a dock had rotted, and a meadow where 135 cars used to park.
byline: Aerial photography and story by the Lakeside Parks Conservancy
lang: en
location:
  name: Lakeside
  region: Ohio (fictional)
  lat: 40.9490
  lon: -82.0447
timezone: America/New_York
brand: brand/brand.yaml
footage_dir: footage
draft: false
simulated: true

align:
  method: auto
  detector: sift
  max_features: 8000
  detect_width: 1600
  ecc_refine: true
  # Snow-covered visits share fewer features with the late-summer reference; accept smaller
  # consensus sets (the masters review sheet flags anything doubtful).
  min_inliers: 30

grade:
  mode: reinhard
  # Visits differ in exposure, white balance and season on purpose. Normalize only halfway so the
  # seasons stay visible in the time-lapse.
  strength: 0.5

select:
  sample_every_s: 0.5
  max_candidates_per_source: 120
  gps_radius_m: 60

output:
  single_file: true
  service_worker: true
  film:
    enabled: true
    width: 1920
    height: 1080
    fps: 30
    hold_s: 1.0
    fade_s: 0.8
    vertical: true
    title_card_s: 3.0
    end_card_s: 3.0
  images:
    widths: [960, 1600, 2560]
    formats: [avif, jpeg]
    master_width: 2560
