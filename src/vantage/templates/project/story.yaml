# story.yaml — the editorial layer: viewpoints ("vantages"), visit labels and chapters.
# Models: src/vantage/config.py (Story). Copy marked TODO must be replaced before delivery;
# `vantage validate {{slug}}` counts what is left.
#
# Capture references (capture / from / to / before / after):
#   "earliest" | "latest" | a flight date in quotes, e.g. "2025-06-14" (nearest visit on or before it)
# Text fields are Markdown. Coordinates (x, y, focus) are 0–1 fractions of the aligned image.
# Every number, date or claim is a {fact:id} token backed by facts.yaml (text, sources, status).

vantages:
  - id: overview
    name: "TODO: Overview from the north"
    # After `vantage ingest {{slug}}`, open work/contact/<date>.jpg and pin the frame that every
    # other visit is aligned to (path relative to footage/, t in seconds for videos):
    # reference: { source: "2026-09-12/DJI_0042.MP4", t: 12.5 }
    # Optional telemetry hint, so unrelated shots from the same flights are ignored:
    # hint: { lat: 41.0000, lon: -81.0000, alt_m: 90, heading_deg: 180 }
    # Manual override when the automatic pick for a visit is wrong:
    # picks:
    #   "2025-06-14": { source: "2025-06-14/DJI_0007.MP4", t: 31.0 }

captures: []
# Optional per-visit labels, notes and exclusions (dates are flight dates):
# captures:
#   - date: 2025-06-14
#     label: "June 2025"
#     note: "Demolition begins"
#   - date: 2025-07-02
#     exclude: true

chapters:
