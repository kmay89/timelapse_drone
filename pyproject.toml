[project]
name = "vantage"
version = "0.1.0"
description = "Turn repeat drone flights over a changing site into a cinematic, iPhone-first interactive progress story."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=11.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
vantage = "vantage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end tests that render video (deselect with -m 'not slow')",
]
